name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun lint
      - run: bun test
      - if: inputs.upload-pages
        uses: actions/configure-pages@v6
      - run: bun export
        env:
          BASE_PATH: ${{ inputs.upload-pages && format('/{0}', github.event.repository.name) || '' }}
      - if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build
